<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyGPT</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>
<main>
<h1>MyGPT</h1>
<p>GPT-style language model built from scratch.</p>

<section id="chat"></section>

<form id="form">
<textarea
    id="prompt"
    rows="4"
    placeholder="Write a prompt..."
    required></textarea>

<div class="controls">

<label>
Temperature
<input
    id="temperature"
    type="number"
    value="0.8"
    min="0.1"
    max="2"
    step="0.1">
</label>

<label>
Max tokens
<input
    id="maxTokens"
    type="number"
    value="200"
    min="1"
    max="2000">
</label>

<button type="submit">
Generate
</button>

</div>
</form>
</main>

<script src="/static/app.js"></script>
</body>
</html>
